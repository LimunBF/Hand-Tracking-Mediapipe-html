<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Riso Plane · Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#10131a;overflow:hidden;font-family:'Trebuchet MS',sans-serif;color:#fff}
#vid{position:fixed;top:-9999px;left:-9999px;width:640px;height:480px;opacity:0;pointer-events:none}
main canvas{display:block;position:fixed;inset:0}
#status{
  position:fixed;top:16px;right:18px;z-index:10;
  color:#fff;font-size:12px;font-weight:700;text-align:right;line-height:1.5;
  background:rgba(10,14,20,.78);padding:8px 12px;border-radius:8px;
  border:1px solid rgba(255,255,255,.24)
}
#counter{
  position:fixed;top:16px;left:18px;z-index:10;
  color:#fff;font-size:13px;line-height:1.5;
  background:rgba(10,14,20,.84);padding:12px 16px;border-radius:10px;
  border:1px solid rgba(255,255,255,.24);box-shadow:0 8px 28px rgba(0,0,0,.28)
}
#counter .num{font-size:32px;color:#ff76df;font-variant-numeric:tabular-nums;font-weight:800;min-width:44px;display:inline-block}
#counter .lbl{font-size:10px;color:#dce7f5;font-weight:700;letter-spacing:.1em}
.hand-row{display:flex;align-items:baseline;gap:10px;margin-bottom:3px}
#mode-toggle{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;gap:6px;background:rgba(10,14,20,.88);padding:6px;border-radius:12px;
  border:1px solid rgba(255,255,255,.24);box-shadow:0 8px 28px rgba(0,0,0,.3)
}
.mode-btn{
  min-height:44px;background:transparent;border:1px solid transparent;color:#dce7f5;
  padding:10px 18px;border-radius:8px;cursor:pointer;
  font:700 12px 'Trebuchet MS',sans-serif;transition:background .18s,color .18s,border-color .18s;user-select:none
}
.mode-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.mode-btn:focus-visible{outline:3px solid #ffe85c;outline-offset:3px}
.mode-btn.active{background:#f5df50;color:#121722;border-color:#fff2a0}
#mode-toggle .mode-btn[data-mode="laser"].active{background:#20c8e8;color:#071319;border-color:#8becff}
#hint{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;
  max-width:min(420px,calc(100vw - 32px));text-align:center;color:#fff;font-size:18px;font-weight:800;
  line-height:1.5;pointer-events:none;transition:opacity .5s;
  background:rgba(10,14,20,.88);padding:20px 24px;border-radius:12px;
  border:1px solid rgba(255,255,255,.3);box-shadow:0 12px 40px rgba(0,0,0,.35)
}
#hint small{font-size:13px;color:#dce7f5;font-weight:500;display:block;margin-top:6px}
@media(max-width:680px){
  #counter{top:10px;left:10px;padding:9px 11px}
  #counter .num{font-size:25px;min-width:34px}
  #status{top:10px;right:10px;font-size:10px}
  #mode-toggle{bottom:10px;width:calc(100% - 20px);justify-content:stretch}
  .mode-btn{flex:1;padding:8px 5px;font-size:10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<video id="vid" playsinline autoplay muted></video>

<div id="counter">
  <div class="hand-row"><span class="lbl">LEFT</span><span class="num" id="leftCount">—</span><span class="lbl" id="leftGest"></span></div>
  <div class="hand-row"><span class="lbl">RIGHT</span><span class="num" id="rightCount">—</span><span class="lbl" id="rightGest"></span></div>
  <div class="hand-row" style="margin-top:10px;border-top:1px solid rgba(0,255,255,.3);padding-top:8px">
    <span class="lbl">TOTAL</span><span class="num" id="totalCount" style="color:#FFEB3B;text-shadow:0 0 14px rgba(255,235,60,.95),0 0 4px rgba(0,0,0,1)">—</span><span class="lbl">FINGERS</span>
  </div>
</div>

<div id="mode-toggle">
  <button class="mode-btn active" data-mode="laser" onclick="setMode('laser',this)">⚡ LASER</button>
  <button class="mode-btn" data-mode="riso" onclick="setMode('riso',this)">▦ RISO PLANE</button>
  <button class="mode-btn" data-mode="both" onclick="setMode('both',this)">✦ BOTH</button>
</div>

<div id="status">initializing…</div>
<div id="hint">◇ loading mediapipe ◇<br><small>allow camera access if prompted</small></div>

<script>
// ════════════════════════════════════════════════════════════════════════════
//   RISO PLANE — risograph print effect clipped to fingertip convex hull
//
//   Effect analysis from reference video:
//   - 4-color riso palette: cream paper, prussian blue, lime green-yellow,
//     riso red (corner stipple only)
//   - 3-level posterization based on luminance
//   - Bayer matrix ordered dithering = halftone screen feel
//   - Polygon clip from convex hull of extended fingertips
//   - Cream paper background fills the polygon, then posterized video on top
//   - Red corner stipple clusters at each hull vertex
// ════════════════════════════════════════════════════════════════════════════

const FINGERTIPS = [4, 8, 12, 16, 20];
const FINGER_NAMES = ['thumb','index','middle','ring','pinky'];
const FINGER_PIPS  = [3, 6, 10, 14, 18];
const ALL_LANDMARKS = 21;
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17]
];

// ── Riso palette (extracted from reference video) ──
const RISO = {
  PAPER:    [245, 240, 222],   // cream paper
  BLUE:     [22,  56,  125],   // prussian blue
  GREEN:    [175, 225, 70],    // fluorescent lime green
  DARK:     [12,  28,  68],    // deepest shadows
  RED:      [216, 53,  75]     // riso red (used as stipple)
};

// Bayer 8×8 dither matrix (for halftone screening)
const BAYER_8 = [
   0,32, 8,40, 2,34,10,42,
  48,16,56,24,50,18,58,26,
  12,44, 4,36,14,46, 6,38,
  60,28,52,20,62,30,54,22,
   3,35,11,43, 1,33, 9,41,
  51,19,59,27,49,17,57,25,
  15,47, 7,39,13,45, 5,37,
  63,31,55,23,61,29,53,21
];

let hands = [];
let modelReady = false;
let handsEverSeen = false;
let vidEl;
let t = 0;
let particles = [];
let prevTouchPairs = new Set();
let mode = 'laser';

// Offscreen canvases for riso processing
let rawCanvas, rawCtx;     // mirrored video (downsampled)
let risoCanvas, risoCtx;   // riso-filtered output
let risoImageData;          // reusable ImageData buffer
const RISO_W = 320;         // riso processing resolution
const RISO_H = 240;

function setMode(m, el) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function setup() {
  const cnv = createCanvas(windowWidth, windowHeight);
  cnv.parent(document.body);
  pixelDensity(1);
  frameRate(60);

  rawCanvas  = document.createElement('canvas');
  rawCanvas.width = RISO_W; rawCanvas.height = RISO_H;
  rawCtx = rawCanvas.getContext('2d', { willReadFrequently: true });

  risoCanvas = document.createElement('canvas');
  risoCanvas.width = RISO_W; risoCanvas.height = RISO_H;
  risoCtx = risoCanvas.getContext('2d');
  risoImageData = risoCtx.createImageData(RISO_W, RISO_H);

  initMediaPipe();
}
function windowResized() { resizeCanvas(windowWidth, windowHeight); }

let vidDraw = null;

function draw() {
  t += 0.018;
  const ctx = drawingContext;
  ctx.shadowBlur = 0;

  // ── 1. CAMERA BACKGROUND ──
  vidDraw = null;
  if (vidEl && vidEl.readyState >= 2 && vidEl.videoWidth > 0) {
    const vw = vidEl.videoWidth, vh = vidEl.videoHeight;
    const cR = width / height, vR = vw / vh;
    let sx, sy, sw, sh;
    if (vR > cR) { sh = vh; sw = vh * cR; sx = (vw - sw) / 2; sy = 0; }
    else         { sw = vw; sh = vw / cR; sx = 0; sy = (vh - sh) / 2; }
    vidDraw = { sx, sy, sw, sh };

    ctx.save();
    ctx.translate(width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(vidEl, sx, sy, sw, sh, 0, 0, width, height);
    ctx.restore();
  } else {
    const grd = ctx.createLinearGradient(0, 0, 0, height);
    grd.addColorStop(0, '#1a1a3e');
    grd.addColorStop(1, '#0a0a1e');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, width, height);
  }

  if (!hands.length) {
    updateParticles(ctx);
    updateFingerHUD([]);
    return;
  }

  const sorted = [...hands].sort((a,b) => a.pts[0][0] - b.pts[0][0]);
  const A = sorted[0];
  const B = sorted.length > 1 ? sorted[1] : null;

  updateFingerHUD(sorted);

  // ── 2. RISO PLANE ──
  if ((mode === 'riso' || mode === 'both') && B && vidDraw) {
    updateRisoTexture();
    drawRisoPlane(A, B, ctx);
  }

  for (const h of hands) drawHandSkeleton(h, ctx);

  if ((mode === 'laser' || mode === 'both') && B) {
    drawLaserCradle(A, B, ctx);
  }

  detectTouches();
  for (const h of hands) drawLandmarks(h, ctx);
  for (const h of hands) drawFingerLabels(h, ctx);
  updateParticles(ctx);
}

// ═══════════════════════════════════════════════════════════════════════════
//   RISO TEXTURE PROCESSING
//   Per frame: render mirrored video small → apply Bayer dither + posterize
//   → map to riso palette. Result lives in risoCanvas, ready to be sampled.
// ═══════════════════════════════════════════════════════════════════════════

function updateRisoTexture() {
  // Step 1: render mirrored, downsampled video to rawCanvas
  rawCtx.save();
  rawCtx.translate(RISO_W, 0);
  rawCtx.scale(-1, 1);
  rawCtx.drawImage(vidEl, vidDraw.sx, vidDraw.sy, vidDraw.sw, vidDraw.sh, 0, 0, RISO_W, RISO_H);
  rawCtx.restore();

  // Step 2: read pixels, apply riso filter, write to risoImageData
  const src = rawCtx.getImageData(0, 0, RISO_W, RISO_H).data;
  const dst = risoImageData.data;

  for (let y = 0; y < RISO_H; y++) {
    for (let x = 0; x < RISO_W; x++) {
      const i = (y * RISO_W + x) * 4;
      const r = src[i], g = src[i + 1], b = src[i + 2];

      // Luminance (Rec. 601)
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;

      // Bayer ordered dither — pushes luminance up or down based on position
      // Creates the characteristic halftone screen look of riso prints
      const bayerVal = BAYER_8[(y & 7) * 8 + (x & 7)];   // 0..63
      const bayerOffset = (bayerVal / 64 - 0.5) * 60;     // -30..+30

      // Tiny additional random noise for organic feel
      const noise = (Math.random() - 0.5) * 18;

      const dithered = lum + bayerOffset + noise;

      // Posterize to 3 luminance buckets → 3 riso colors
      // The thresholds determine how much paper/green/blue shows
      let color;
      if (dithered > 195) {
        color = RISO.PAPER;
      } else if (dithered > 115) {
        color = RISO.GREEN;
      } else if (dithered > 50) {
        color = RISO.BLUE;
      } else {
        color = RISO.DARK;
      }

      // Sparse red stipple in dark/medium areas (decorative riso pop)
      if (dithered < 130 && Math.random() < 0.008) {
        color = RISO.RED;
      }

      dst[i]     = color[0];
      dst[i + 1] = color[1];
      dst[i + 2] = color[2];
      dst[i + 3] = 255;
    }
  }

  risoCtx.putImageData(risoImageData, 0, 0);
}

// ═══════════════════════════════════════════════════════════════════════════
//   RISO PLANE — clip the riso texture to the convex hull of fingertips
// ═══════════════════════════════════════════════════════════════════════════

function drawRisoPlane(A, B, ctx) {
  // Collect extended fingertips from both hands
  const tips = [];
  const extA = getExtendedFingers(A.pts);
  const extB = getExtendedFingers(B.pts);
  for (const i of extA) tips.push({ x: A.pts[FINGERTIPS[i]][0], y: A.pts[FINGERTIPS[i]][1] });
  for (const i of extB) tips.push({ x: B.pts[FINGERTIPS[i]][0], y: B.pts[FINGERTIPS[i]][1] });
  if (tips.length < 3) return;

  // Compute convex hull (Andrew's monotone chain)
  const hull = convexHull(tips);
  if (hull.length < 3) return;

  // ── Clip to hull and paint ──
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(hull[0].x, hull[0].y);
  for (let i = 1; i < hull.length; i++) ctx.lineTo(hull[i].x, hull[i].y);
  ctx.closePath();
  ctx.clip();

  // Cream paper background
  ctx.fillStyle = `rgb(${RISO.PAPER[0]}, ${RISO.PAPER[1]}, ${RISO.PAPER[2]})`;
  ctx.fillRect(0, 0, width, height);

  // Riso-filtered video, scaled to fill (positioned to center on the hull bounding box)
  // Use a slight scale-up + shift so the face/content centers naturally in the polygon
  const bbox = boundingBox(hull);
  const bboxW = bbox.maxX - bbox.minX;
  const bboxH = bbox.maxY - bbox.minY;
  // Fit the riso texture to the bbox with cover behavior
  const risoRatio = RISO_W / RISO_H;
  const bboxRatio = bboxW / bboxH;
  let dw, dh;
  if (bboxRatio > risoRatio) { dw = bboxW * 1.3; dh = dw / risoRatio; }
  else                        { dh = bboxH * 1.3; dw = dh * risoRatio; }
  const dx = bbox.minX + (bboxW - dw) / 2;
  const dy = bbox.minY + (bboxH - dh) / 2;

  // Slight chromatic misregistration: draw riso 3 times with channel-tinted offsets
  // Combined with overlay/multiply blend creates the classic "off-press" feel
  ctx.imageSmoothingEnabled = false;   // chunky pixel feel matches risograph

  // Layer 1: blue+green channel (no shift)
  ctx.globalAlpha = 1;
  ctx.drawImage(risoCanvas, dx, dy, dw, dh);

  // Layer 2: red ghost layer shifted (riso misregistration)
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.25;
  ctx.drawImage(risoCanvas, dx + 3, dy - 1, dw, dh);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  ctx.restore();   // un-clip

  // ── Hull border (paper-white edge, like edge of a print) ──
  ctx.strokeStyle = `rgba(255, 250, 232, 0.92)`;
  ctx.lineWidth = 3.5;
  ctx.lineJoin = 'miter';
  ctx.beginPath();
  ctx.moveTo(hull[0].x, hull[0].y);
  for (let i = 1; i < hull.length; i++) ctx.lineTo(hull[i].x, hull[i].y);
  ctx.closePath();
  ctx.stroke();

  // Inner darker border for depth
  ctx.strokeStyle = `rgba(${RISO.DARK[0]}, ${RISO.DARK[1]}, ${RISO.DARK[2]}, 0.5)`;
  ctx.lineWidth = 1;
  ctx.stroke();

  // ── Corner red stipple clusters (signature riso detail) ──
  for (const v of hull) {
    drawCornerStipple(ctx, v.x, v.y);
  }
}

function convexHull(points) {
  if (points.length < 3) return points.slice();
  const pts = points.map(p => ({x: p.x, y: p.y})).sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}

function boundingBox(pts) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of pts) {
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  return { minX, minY, maxX, maxY };
}

function drawCornerStipple(ctx, x, y) {
  ctx.fillStyle = `rgba(${RISO.RED[0]}, ${RISO.RED[1]}, ${RISO.RED[2]}, 0.9)`;
  const cluster = 22;
  for (let i = 0; i < cluster; i++) {
    const r = Math.random() * 22 + 4;
    const a = Math.random() * Math.PI * 2;
    const dx = Math.cos(a) * r;
    const dy = Math.sin(a) * r;
    ctx.beginPath();
    ctx.arc(x + dx, y + dy, Math.random() * 1.6 + 0.6, 0, Math.PI * 2);
    ctx.fill();
  }
  // A few brighter cores
  ctx.fillStyle = `rgba(${RISO.RED[0]}, ${RISO.RED[1]}, ${RISO.RED[2]}, 1)`;
  for (let i = 0; i < 6; i++) {
    const r = Math.random() * 8 + 2;
    const a = Math.random() * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, Math.random() * 2 + 1, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ═══════════════════════════════════════════════════════════════════════════

function isFingerExtended(pts, fingerIdx) {
  const wrist = pts[0];
  const tip = pts[FINGERTIPS[fingerIdx]];
  const pip = pts[FINGER_PIPS[fingerIdx]];
  if (fingerIdx === 0) {
    const thumbTip = pts[4], thumbMcp = pts[2], indexMcp = pts[5];
    return dist(thumbTip[0], thumbTip[1], indexMcp[0], indexMcp[1]) >
           dist(thumbMcp[0], thumbMcp[1], indexMcp[0], indexMcp[1]) * 1.15;
  }
  return dist(tip[0], tip[1], wrist[0], wrist[1]) >
         dist(pip[0], pip[1], wrist[0], wrist[1]) * 1.05;
}
function getExtendedFingers(pts) {
  const ext = [];
  for (let i = 0; i < 5; i++) if (isFingerExtended(pts, i)) ext.push(i);
  return ext;
}
function gestureName(extended) {
  const e = extended.join(',');
  if (e === '') return 'fist ✊';
  if (e === '0,1,2,3,4') return 'open ✋';
  if (e === '1') return 'point ☝';
  if (e === '1,2') return 'peace ✌';
  if (e === '0,1,4') return 'rock 🤘';
  if (e === '0,4') return 'shaka 🤙';
  if (e === '0,1') return 'gun 🔫';
  if (e === '1,2,3,4') return 'four';
  if (e === '0') return 'thumbs ↑';
  if (e === '1,4') return 'devil';
  return '';
}
function updateFingerHUD(sortedHands) {
  const left  = sortedHands[0] ? getExtendedFingers(sortedHands[0].pts) : null;
  const right = sortedHands[1] ? getExtendedFingers(sortedHands[1].pts) : null;
  const lc = left  ? left.length  : 0;
  const rc = right ? right.length : 0;
  document.getElementById('leftCount').textContent  = left  ? lc : '—';
  document.getElementById('rightCount').textContent = right ? rc : '—';
  document.getElementById('totalCount').textContent = (left||right) ? (lc + rc) : '—';
  document.getElementById('leftGest').textContent   = left  ? gestureName(left)  : '';
  document.getElementById('rightGest').textContent  = right ? gestureName(right) : '';
}

function drawHandSkeleton(hand, ctx) {
  ctx.shadowBlur = 16;
  ctx.shadowColor = 'rgba(0, 255, 255, 1)';
  ctx.strokeStyle = mode === 'riso' ? 'rgba(255, 240, 200, 0.8)' : 'rgba(0, 240, 255, 0.95)';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  for (const [a, b] of HAND_CONNECTIONS) {
    ctx.beginPath();
    ctx.moveTo(hand.pts[a][0], hand.pts[a][1]);
    ctx.lineTo(hand.pts[b][0], hand.pts[b][1]);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
}

function drawLandmarks(hand, ctx) {
  const extended = getExtendedFingers(hand.pts);
  for (let i = 0; i < ALL_LANDMARKS; i++) {
    const [x, y] = hand.pts[i];
    const tipIdx = FINGERTIPS.indexOf(i);
    const isTip = tipIdx !== -1;
    const isExtTip = isTip && extended.includes(tipIdx);
    const isKnuckle = (i === 0 || i === 5 || i === 9 || i === 13 || i === 17);

    if (isExtTip) {
      const tipColor = mode === 'riso' ? `rgba(${RISO.RED[0]}, ${RISO.RED[1]}, ${RISO.RED[2]}, 1)` : 'rgba(255, 80, 220, 1)';
      const tipGlow  = mode === 'riso' ? `rgba(${RISO.RED[0]}, ${RISO.RED[1]}, ${RISO.RED[2]}, 1)` : 'rgba(255, 0, 200, 1)';
      ctx.shadowBlur = 30;
      ctx.shadowColor = tipGlow;
      ctx.fillStyle = tipColor;
      ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 12;
      ctx.shadowColor = 'rgba(255, 255, 255, 1)';
      ctx.fillStyle = 'rgba(255, 255, 255, 1)';
      ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI*2); ctx.fill();
    } else if (isTip) {
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(100, 100, 150, 0.6)';
      ctx.fillStyle = 'rgba(180, 180, 220, 0.65)';
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
    } else if (isKnuckle) {
      ctx.shadowBlur = 12;
      ctx.shadowColor = 'rgba(255, 220, 0, 1)';
      ctx.fillStyle = 'rgba(255, 235, 80, 1)';
      ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.shadowBlur = 7;
      ctx.shadowColor = 'rgba(0, 255, 255, 0.85)';
      ctx.fillStyle = 'rgba(80, 240, 255, 0.95)';
      ctx.beginPath(); ctx.arc(x, y, 2.4, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.shadowBlur = 0;
}

function drawFingerLabels(hand, ctx) {
  const extended = getExtendedFingers(hand.pts);
  ctx.shadowBlur = 8;
  ctx.shadowColor = 'rgba(0, 0, 0, 1)';
  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  for (const fi of extended) {
    const [x, y] = hand.pts[FINGERTIPS[fi]];
    ctx.fillStyle = mode === 'riso' ? 'rgba(255, 250, 232, 1)' : 'rgba(255, 235, 80, 1)';
    ctx.fillText(FINGER_NAMES[fi].toUpperCase(), x, y - 18);
  }
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawLaserCradle(A, B, ctx) {
  const extA = getExtendedFingers(A.pts);
  const extB = getExtendedFingers(B.pts);
  if (!extA.length || !extB.length) return;
  let avgDist = 0, n = 0;
  for (const ai of extA) for (const bi of extB) {
    avgDist += dist(A.pts[FINGERTIPS[ai]][0], A.pts[FINGERTIPS[ai]][1],
                    B.pts[FINGERTIPS[bi]][0], B.pts[FINGERTIPS[bi]][1]);
    n++;
  }
  avgDist /= Math.max(n, 1);
  const norm = constrain(map(avgDist, 80, Math.min(width, height) * 0.7, 0, 1), 0, 1);
  const baseThickness = lerp(2.4, 0.8, norm);
  let idx = 0;
  for (const ai of extA) {
    for (const bi of extB) {
      const [ax, ay] = A.pts[FINGERTIPS[ai]];
      const [bx, by] = B.pts[FINGERTIPS[bi]];
      const hueShift = (idx * 17 + t * 22) % 360;
      const {r, g, b} = hueToCMY(hueShift, norm);
      const shimmer = Math.sin(t * 8 + idx * 0.9) * 1.5;
      const mx = (ax + bx) / 2 + shimmer;
      const my = (ay + by) / 2 + shimmer * 0.6;
      ctx.shadowBlur = 38;
      ctx.shadowColor = `rgba(${r},${g},${b},0.95)`;
      ctx.strokeStyle = `rgba(${r},${g},${b},0.14)`;
      ctx.lineWidth = baseThickness * 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx, my, bx, by); ctx.stroke();
      ctx.shadowBlur = 22;
      ctx.strokeStyle = `rgba(${r},${g},${b},0.45)`;
      ctx.lineWidth = baseThickness * 2.2;
      ctx.beginPath();
      ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx, my, bx, by); ctx.stroke();
      ctx.shadowBlur = 14;
      ctx.shadowColor = `rgba(255,255,255,1)`;
      ctx.strokeStyle = `rgba(255,255,255,0.95)`;
      ctx.lineWidth = baseThickness * 0.6;
      ctx.beginPath();
      ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx, my, bx, by); ctx.stroke();
      idx++;
    }
  }
  ctx.shadowBlur = 0;
}

function detectTouches() {
  if (hands.length < 2) { prevTouchPairs = new Set(); return; }
  const sorted = [...hands].sort((a,b) => a.pts[0][0] - b.pts[0][0]);
  const A = sorted[0], B = sorted[1];
  const extA = getExtendedFingers(A.pts);
  const extB = getExtendedFingers(B.pts);
  const TOUCH_RADIUS = 40;
  const current = new Set();
  for (const ai of extA) {
    for (const bi of extB) {
      const [ax, ay] = A.pts[FINGERTIPS[ai]];
      const [bx, by] = B.pts[FINGERTIPS[bi]];
      const d = dist(ax, ay, bx, by);
      if (d < TOUCH_RADIUS) {
        const key = `${ai}-${bi}`;
        current.add(key);
        if (!prevTouchPairs.has(key)) explode((ax + bx) / 2, (ay + by) / 2, ai, bi);
      }
    }
  }
  prevTouchPairs = current;
}

function explode(x, y, ai, bi) {
  for (let i = 0; i < 36; i++) {
    const ang = (Math.PI * 2 * i) / 36 + Math.random() * 0.3;
    const sp = 3 + Math.random() * 6;
    const {r, g, b} = hueToCMY((ai * 5 + bi) * 17 + t * 22, 0.3);
    particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1.0,decay:0.018+Math.random()*0.012,r,g,b,sz:1.6+Math.random()*2.6});
  }
  for (let i = 0; i < 14; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1.0,decay:0.03+Math.random()*0.02,r:255,g:255,b:255,sz:1.8+Math.random()*1.5});
  }
}

function updateParticles(ctx) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.94; p.vy *= 0.94;
    p.vy += 0.08;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.shadowBlur = 20;
    ctx.shadowColor = `rgba(${p.r},${p.g},${p.b},${p.life})`;
    ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${p.life})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.sz * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function hueToCMY(hue, stretch) {
  const h = (hue % 360 + 360) % 360;
  let r, g, b;
  if (h < 120) { const f = h/120; r=lerp(0,255,f); g=lerp(255,0,f); b=255; }
  else if (h < 240) { const f=(h-120)/120; r=255; g=lerp(0,255,f); b=lerp(255,0,f); }
  else { const f=(h-240)/120; r=255; g=lerp(255,0,f); b=lerp(0,255,f); }
  const sb = stretch*0.4;
  return {r:Math.round(lerp(r,255,sb)),g:Math.round(lerp(g,200,sb*0.3)),b:Math.round(lerp(b,255,sb*0.2))};
}

async function initMediaPipe() {
  vidEl = document.getElementById('vid');
  const handsModel = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`
  });
  handsModel.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.5
  });

  handsModel.onResults(res => {
    if (!modelReady) {
      modelReady = true;
      document.getElementById('hint').innerHTML = '◇ tunjukkan dua tangan ◇<br><small>klik ▦ RISO PLANE untuk efek riso print</small>';
    }
    if (res.multiHandLandmarks && res.multiHandLandmarks.length) {
      if (!handsEverSeen) {
        handsEverSeen = true;
        document.getElementById('hint').style.opacity = '0';
      }
      hands = res.multiHandLandmarks.map((lms) => ({
        pts: lms.map(lm => [(1 - lm.x) * width, lm.y * height]),
        z:   lms.map(lm => lm.z)
      }));
      document.getElementById('status').textContent = `hands: ${hands.length}  ·  fps: ${Math.round(frameRate())}  ·  mode: ${mode}`;
    } else {
      hands = [];
      document.getElementById('status').textContent = `hands: 0  ·  mode: ${mode}`;
    }
  });

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, facingMode: 'user' }
    });
    vidEl.srcObject = stream;
    await vidEl.play();
    document.getElementById('status').textContent = 'loading model…';
    const cam = new Camera(vidEl, {
      onFrame: async () => { await handsModel.send({ image: vidEl }); },
      width: 1280, height: 720
    });
    cam.start();
  } catch (e) {
    document.getElementById('hint').innerHTML = '⚠ camera access denied<br><small>allow permission & refresh</small>';
    document.getElementById('status').textContent = 'error: ' + e.message;
  }
}
